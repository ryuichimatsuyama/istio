apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  frontend-slo.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "Frontend SLO",
          "type": "stat",
          "targets": [
            {
              "expr": "1 - slo:period_burn_rate:ratio{sloth_service=\"frontend\",sloth_slo=\"availability\"}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "title": "Error Budget Remaining",
          "type": "stat",
          "targets": [
            {
              "expr": "slo:period_error_budget_remaining:ratio{sloth_service=\"frontend\",sloth_slo=\"availability\"}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "title": "SLO Error Ratio - 5m",
          "type": "timeseries",
          "targets": [
            {
              "expr": "slo:sli_error:ratio_rate5m{sloth_service=\"frontend\",sloth_slo=\"availability\"}",
              "legendFormat": "5m error ratio",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 4,
          "title": "Current Burn Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "slo:current_burn_rate:ratio{sloth_service=\"frontend\",sloth_slo=\"availability\"}",
              "legendFormat": "Burn rate",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "slo",
        "frontend",
        "sloth"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "Frontend SLO",
      "uid": "frontend-slo",
      "version": 1
    }
