apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: frontend-slo
  namespace: monitoring
  labels:
    release: monitoring
spec:
  labels:
    service: frontend
    team: platform

  service: frontend

  slos:
    - name: availability
      objective: 99.9
      description: Frontend HTTP availability SLO

      sli:
        events:
          errorQuery: |
            sum(rate(
              istio_requests_total{
                reporter="destination",
                destination_workload="frontend",
                request_protocol="http",
                response_code=~"5.."
              }[{{.window}}]
            ))

          totalQuery: |
            sum(rate(
              istio_requests_total{
                reporter="destination",
                destination_workload="frontend",
                request_protocol="http"
              }[{{.window}}]
            ))

      alerting:
        name: FrontendAvailability
        labels:
          category: availability
        annotations:
          summary: Frontend availability SLO is being burned
