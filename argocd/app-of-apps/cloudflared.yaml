apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://cloudflare.github.io/helm-charts
    chart: cloudflare-tunnel
    targetRevision: 0.3.2

    helm:
      values: |
        replicaCount: 2

        cloudflare:
          tunnelName: eks-online-boutique

          secretName: cloudflared-token

          ingress:
            - hostname: shop.ryuichi-sre.com
              service: http://frontend.microservices-demo.svc.cluster.local:80

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
