apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-actions-rbac
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ryuichimatsuyama/microservices-demo.git
    targetRevision: main
    path: argocd/github-actions-rbac

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
