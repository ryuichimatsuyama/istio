apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sloth
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://slok.github.io/sloth
    chart: sloth
    targetRevision: 0.16.0
    helm:
      values: |
        sloth:
          extraLabels:
            release: monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: sloth

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
