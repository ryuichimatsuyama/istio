apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger-storage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ryuichimatsuyama/istio.git
    targetRevision: HEAD
    path: argocd/jaeger-storage

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
